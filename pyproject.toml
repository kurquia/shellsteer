[project]
name = "shellsteer"
version = "0.1.0"
description = "Steering vectors for the residual stream of ShellFlow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellsteer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
