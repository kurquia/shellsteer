[project]
name = "shellsteer"
version = "0.1.0"
description = "Steering vectors for the residual stream of ShellFlow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "shellflow",
    "huggingface-hub>=0.26",
    "matplotlib>=3.8",
]

[project.scripts]
steer = "shellsteer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellsteer"]

[tool.uv.sources]
shellflow = { git = "https://github.com/pomidori/ShellFlow", rev = "2622c84" }
