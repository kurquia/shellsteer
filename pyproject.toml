[project]
name = "shellsteer"
version = "0.1.0"
description = "Steering vectors for the residual stream of ShellFlow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "shellflow",
    "huggingface-hub>=0.26",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellsteer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU (select with -m gpu)"]

[tool.uv.sources]
shellflow = { git = "https://github.com/pomidori/ShellFlow", rev = "2622c84" }
