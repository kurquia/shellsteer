# Paper Figs. 4 and 14 (Sec. 5.1, App. D.1): the Z steering vector of main_z_block1.yaml added to every muon of
# 1,000,000 validation events of every final state (sample C), and the kinematics of every particle type.
# The gradients and the steering vectors come from the muon-pair sample, as in main_z_block1.yaml; the steering sample
# has no pairs, so this config runs the kinematics chain: gradients, steering-vectors, generate, kinematics-readout,
# kinematics-plots.

name: all_muons
network: shellflow
networks: ../networks.yaml          # relative to this file
datasets: ../datasets.yaml          # relative to this file
classes: ../classes.yaml            # relative to this file
target: Z

# Which events, and how many.
events:
  dataset: validation_muon_pairs    # the directions sample: gradients and steering vectors
  steering_dataset: validation_all_final_states   # sample C: the events we steer and generate
  directions: 1040000               # events for the gradients and the steering vectors
  steering: 1000000                 # sample C: 1,000,000 events of every final state, all generated in file order
  keep: 1000000                     # pairs of the directions sample that enter the classes; sample C has no classes

# The Euler sampler that generates the events.
sampler:
  steps: 200
  batch_size: 8192
  precision: float32
  on_nan: set_to_zero               # set_to_zero (as the paper) | stop: stop on a NaN; NaNs are counted either way

# Gradients of log m of the pair with respect to the residual stream, on the directions sample.
gradients:
  blocks: [0, 1, 2, 3, 4, 5]
  seed: 2040

# Steering vectors from the class moments of the gradients.
steering_vectors:
  method: fkt                       # fkt | fisher | meandiff
  in_time: per_step                 # per_step | constant
  balance: equal                    # equal | by_count
  from_file: null                   # null: from the gradient pass | vectors/main_block1.npz, the Z vectors of
                                    # main_z_block1.yaml at block 1; then the run has no gradient pass

# The edit h_L -> h_L + alpha xi(t), on the steering sample.
steering:
  block: 1
  alphas: [-2, -1, 1, 2]            # alpha = 0 always runs as the baseline
  tokens: all_of_type               # xi^- on every negative muon, xi^+ on every positive one; no muon, no edit
  steps: all                        # all | [first, last]
  norm_restore: false
  seeds: [2041]                     # the paper ran sample C with one seed

# The kinematics of every particle type (Figs. 4 and 14): counts of p_T, eta, phi, and E for real data, the baseline,
# and each alpha, and the largest change per bin that Sec. 5.1 and App. D.1 quote.
kinematics:
  bins: 60                          # per panel: equal in log for p_T and E, equal in eta and phi
  readout_min_baseline: 1000        # the largest change per bin counts bins with at least this many baseline particles
  ratio_min_baseline: 1             # ratio panels: every bin with baseline particles, as the paper
  other_types_ratio_range: [0.9, 1.1]   # every ratio panel of Fig. 14; Fig. 4 scales each panel to its ratios
  baseline_label: '$\mathtt{ShellFlow}$'
