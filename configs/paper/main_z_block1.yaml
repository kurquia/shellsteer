# Paper Sec. 5: steering of the Z boson at block 1.

name: main_z_block1
network: shellflow
networks: ../networks.yaml          # relative to this file
datasets: ../datasets.yaml          # relative to this file
classes: ../classes.yaml            # relative to this file
target: Z

# Which events, and how many.
events:
  dataset: validation_muon_pairs
  directions: 1040000               # events for the gradients and the steering vectors
  steering: 1040000                 # events we steer and generate

# The Euler sampler that generates the events.
sampler:
  steps: 200
  batch_size: 8192
  precision: float32

# Gradients of log m of the pair with respect to the residual stream, on events A.
gradients:
  blocks: [0, 1, 2, 3, 4, 5]
  seed: 2040

# Steering vectors from the class moments of the gradients.
directions:
  method: fkt                       # fkt | lda | meandiff
  in_time: per_step                 # per_step | constant
  balance: equal                    # equal | by_count

# The edit h_L -> h_L + alpha xi(t), on events B.
steering:
  block: 1
  alphas: [-2, -1, 1, 2]            # alpha = 0 always runs as the baseline
  tokens: pair                      # pair | minus | plus | all_of_type
  steps: all                        # all | [first, last]
  norm_restore: false
  seeds: [2041]

# Histograms and the selectivity metric of the generated spectra.
readout:
  r60_max_mass: 60
  spectrum_bins: 200
