# Event samples the pipeline can load, by name. A dataset of pairs holds two samples of the same pair type:
# directions (gradients and steering vectors) and steering (the events we steer and generate). A dataset of every
# final state (pair: null) holds only a steering sample; a run names it in events.steering_dataset.
# revision: the commit of the Hugging Face repository, so the same files always load.
# events: number of events in each file.

validation_muon_pairs:
  hf_repo: kurquia/shellsteer-events
  revision: 398b8616aa518f8aadc9fc41aea38961400742b9
  files:
    directions: directions-dataset.npz
    steering: steering-dataset.npz
  pair: muon                     # muon | electron | tau
  events: 1040000

# Sample C of paper Fig. 4: 1,000,000 validation events of every final state, with zero, one, or several muons. It has
# no pairs (pair: null), so no directions sample and no priority; every event is used, in file order. The file holds
# the real four-momenta p4 of every particle; m_real is NaN except in events with exactly one muon pair.
validation_all_final_states:
  hf_repo: kurquia/shellsteer-events
  revision: 398b8616aa518f8aadc9fc41aea38961400742b9
  files:
    steering: all-final-states-dataset.npz
  pair: null
  events: 1000000
