# Event samples the pipeline can load, by name. Each holds two samples of the same pair type:
# directions (gradients and steering vectors) and steering (the events we steer and generate).
# revision: the commit of the Hugging Face repository, so the same files always load.
# events: number of events in each file.

validation_muon_pairs:
  hf_repo: kurquia/shellsteer-events
  revision: ed05bb9ac082d25ce67a0578a819b4eb15d89434
  files:
    directions: directions-dataset.npz
    steering: steering-dataset.npz
  pair: muon                     # muon | electron | tau
  events: 1040000
